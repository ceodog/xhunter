# Prior specification for hypothetical-Planet-X (HPX) simulation-based inference.
#
# theta_hpx  -- the inference target: HPX's own orbital elements + mass.
# nuisance   -- latents that are sampled and marginalized over (never used as
#               a label), because they are not known precisely enough to fix.
# fixed      -- physical constants held identical across every simulation
#               (see planetx.constants.GIANT_PLANETS): known to far higher
#               precision than would matter for the HPX signal, so they are
#               NOT sampled and NOT part of theta. This covers a, e, inc,
#               Omega, omega -- the dynamically important architecture.
#               Each giant's orbital PHASE (M) is a separate case: it's
#               randomized uniformly per simulation directly in
#               simgen/worker.py (not configured here), since t=0 doesn't
#               correspond to a real calendar epoch anyway, so pinning
#               every run to today's specific phase would be arbitrary.
#
# See README.md, "Fixed constants vs. nuisance parameters vs. theta".

theta_hpx:
  mass:
    dist: loguniform
    low: 1.0     # Earth masses
    high: 15.0
  a:
    dist: uniform
    low: 250.0   # AU
    high: 800.0
  e:
    dist: uniform
    low: 0.1
    high: 0.6
  i:
    dist: uniform
    low: 0.0     # deg
    high: 40.0
  Omega:
    dist: uniform
    low: 0.0     # deg
    high: 360.0
  omega:
    dist: uniform
    low: 0.0     # deg
    high: 360.0
  M:
    dist: uniform
    low: 0.0     # deg -- orbital phase, expect a near-flat posterior
    high: 360.0

nuisance:
  disk_inner_edge:
    dist: uniform
    low: 30.0    # AU
    high: 45.0
  disk_outer_edge:
    dist: uniform
    low: 50.0    # AU
    high: 100.0
  disk_e_scale:
    dist: uniform
    low: 0.01
    high: 0.15
  disk_i_scale:
    dist: uniform
    low: 1.0     # deg
    high: 10.0

simulation:
  # 500: calibrated against Rubin/LSST's selection function in selection.py
  # (sky_fraction=0.129, detection_mag50=24.5, detection_width=0.1,
  # tracking_efficiency=0.95 -- see SimpleSelectionFunction's docstring for
  # sourcing). At this sky_fraction, 500 particles yields ~15-16 detected
  # objects/simulation on average, matching real ETNO-catalog-scale
  # populations -- empirically swept (300->~9, 500->~16, 700->~21 mean
  # detections). This is 40x fewer particles than the earlier OSSOS-
  # calibrated value (20000, sky_fraction=0.0038) needed for the same
  # detected-population richness, since Rubin's much larger, better-
  # characterized footprint dominates its narrower/deeper magnitude curve.
  # Do not re-inflate this without re-sweeping against whatever
  # sky_fraction is actually in selection.py at the time -- the right
  # particle count is a direct function of that value, not a fixed number.
  n_test_particles: 500
  # Kept numerically equal to planetx.constants.SOLAR_SYSTEM_AGE_YEARS as a
  # convention -- NOT because t=0 (today's GIANT_PLANETS elements) plus
  # this many years equals real calendar "now" (it doesn't; that would
  # require starting from an accurate primordial giant-planet configuration,
  # which this project doesn't model). It's "long enough" for a synthetic
  # disk to develop realistic structure under a representative giant-planet
  # architecture. See the SOLAR_SYSTEM_AGE_YEARS comment in constants.py.
  # If you change one, change the other.
  integration_years: 4.5e9
  # WHFast needs dt well below the shortest orbital period in the system --
  # Jupiter's, at a=5.2 AU, P=a^1.5=~11.87 yr. 0.5 yr is ~1/24 of that, a
  # safe margin (rule of thumb: dt <= P_min/20). At this dt, integrating to
  # 4.5e9 yr is ~9e9 steps -- expensive; for iteration/testing, shorten
  # integration_years rather than loosening dt, since dt is a numerical
  # validity floor, not a tunable speed knob.
  dt_years: 0.5
  use_gr: false   # optional 1-PN correction; forces ias15 integrator when true
  # disk_backend: how the massless test-particle disk is propagated (the
  # massive bodies -- Sun+giants+HPX -- always use real N-body regardless of
  # this setting). "rebound" is the only validated option and MUST stay the
  # default in this file. "secular"/"hybrid" (planetx.simgen.secular) are
  # ~14-8800x cheaper but were validated only out to 2e7 yr (225x short of
  # integration_years above) and measurably degrade at longer timescales,
  # including under-representing Omega clustering -- the actual signal this
  # project exists to detect. Do not switch this away from "rebound" for
  # real training-set generation without re-reading secular.py's docstring.
  disk_backend: rebound
